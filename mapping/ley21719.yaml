# =============================================================================
# Mapping spec: Ley 21.719 (CL) -> controles técnicos de Qualys Policy Compliance
# -----------------------------------------------------------------------------
# Convierte las OBLIGACIONES DE SEGURIDAD de la ley en un Policy XML importable.
# Lo consume compliance_pack/generator.py. Editable por humano (revisión SME).
#
# ALCANCE (leer): Qualys PC audita controles técnicos de configuración. La Ley
# 21.719 es, en su mayoría, organizacional/legal (consentimiento, derechos del
# titular, registro de actividades, DPO, transferencias, sanciones, la Agencia).
# Este pack cubre SOLO el pilar técnicamente auditable: el "deber de seguridad"
# (Art. 14 quinquies), confidencialidad (Art. 14 bis), protección desde el diseño
# (Art. 14 quater) y el sustrato de deteccion de brechas (Art. 14 sexies).
# NO representa la ley entera. Ver `gaps` al final.
# =============================================================================

law:
  id: "ley-21719"
  title: "Ley 21.719 — Regula la protección y el tratamiento de los datos personales y crea la Agencia de Protección de Datos Personales"
  jurisdiction: "Chile"
  published: "2024-12-13"
  source: "Sources/Ley-21719_13-DIC-2024.pdf (BCN, www.leychile.cl)"

policy:
  # Título de la policy resultante (el cliente puede cambiarlo al importar con &title=)
  title: "Ley 21.719 - Medidas de Seguridad del Tratamiento (controles tecnicos) [qley21719]"
  status: "active"
  # Texto de portada (COVER_PAGE). El generador le agrega provenance (fecha, fuentes, conteos).
  cover_page: >-
    Baseline de controles tecnicos que evidencian el cumplimiento de las OBLIGACIONES
    DE SEGURIDAD de la Ley 21.719 de Chile (proteccion de datos personales): principio
    y deber de seguridad (Art. 3 f y Art. 14 quinquies), deber de secreto/confidencialidad
    (Art. 14 bis y Art. 3 h), proteccion desde el diseno y por defecto (Art. 14 quater) y
    el sustrato de deteccion/registro para el reporte de vulneraciones (Art. 14 sexies).
    NO cubre las obligaciones organizacionales/legales de la ley (consentimiento, derechos
    del titular, registro de actividades, transferencias, etc.). Generado por qley21719 a
    partir de benchmarks de libreria de Qualys; el responsable debe ajustar valores
    esperados, alcance (asset tags/groups) y excepciones a su nivel de riesgo (Art. 14 septies).

