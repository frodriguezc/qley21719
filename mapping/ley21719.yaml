# Niveles diferenciados (Art. 14 septies). La ley habilita estandares de seguridad
# distintos segun el TIPO de dato (sensibles, de ninos/adolescentes, geolocalizacion,
# situacion socioeconomica, financieros) y el tamano/actividad del responsable. Se emite
# UN pack por nivel usando la CRITICALITY que cada control ya trae como palanca de filtro
# (0=UNDEFINED · 1=MINIMAL · 2=MEDIUM · 3=SERIOUS · 4=CRITICAL · 5=URGENT):
#   - base:     piso SERIOUS (>=3)  -> subconjunto de alta severidad (estandar general).
#   - sensible: sin piso (>=0)      -> TODOS los controles cosechados (refuerzo para datos
#                                      sensibles / de menores / financieros).
# Invariante: base ⊆ sensible (mismo harvest; base solo filtra mas fuerte -> conteo menor).
# El generador emite cada nivel en su subcarpeta (<out>/base, <out>/sensible) y refleja el
# nivel en el TITLE (sufijo) y el COVER_PAGE (cita Art. 14 septies). CLI: --level base|sensible
# genera uno solo; sin flag, ambos.
levels:
  base:
    title_suffix: "(nivel base)"
    min_criticality: 3        # SERIOUS o superior
  sensible:
    title_suffix: "(datos sensibles)"
    min_criticality: 0        # todo lo cosechado (incl. criticidad UNDEFINED)

# Fallback de clasificacion agnostico (robustez ante benchmarks ARBITRARIOS): un control que NO
# matchea ninguna regla SUB/CATEGORY de `families` cae en `default_family` — SALVO que su SUB_CATEGORY
# este en `exclude_sub_categories`, en cuyo caso se DESCARTA a proposito (no es control de seguridad,
# p.ej. tuning/performance). default_family = hardening: "configuracion segura" es el catch-all natural
# del deber de seguridad (Art. 3 f / 14 quater). Debe ser un id existente de `families`; vacio/ausente =
# sin fallback (retrocompat: el control queda unclassified, como antes).
# NOTAS (footguns):
#   - El exclude es un FALLBACK, no un gate: si el SUB/CATEGORY de un control matchea una familia
#     explicita, GANA la familia y el exclude NO aplica (la precedencia es SUB -> CATEGORY -> fallback).
#   - `unclassified` tiende a 0 SOLO si el catalogo (compliance/control) resuelve CATEGORY/SUB de cada
#     CID cosechado; un CID sin metadata queda unclassified igual (no lo agarra el default).
#   - `exclude_sub_categories` es un PISO no exhaustivo (curado al harvest actual): al sumar benchmarks,
#     revisar la seccion "asignados por default (REVISAR)" de gaps.md y `config_warnings` del summary.
#   - Los controles asignados por el default se LISTAN en gaps.md para revision humana (no son ciegos).
classification:
  default_family: "hardening"
  exclude_sub_categories:
    - "DB Performance and Tuning"   # tuning de DB: no es control de seguridad -> fuera del pack

# Familias = secciones del Policy XML. Un control se asigna a UNA familia.
# Regla de clasificacion: primero por SUB_CATEGORY (para partir "Database Settings"), luego por
# CATEGORY, luego el fallback `classification` de arriba. Lo que no matchea NI cae en default y no
# esta excluido -> gaps.md (no se inventa familia).
#
# COBERTURA POR MODULO (ver mapping/cis_catalog.yaml para el mapeo tecnologia->benchmark):
#   - Host OS / DB / web-middleware / red / virtualizacion: clasifican con las reglas de abajo.
#   - CONTENEDORES (CIS Docker / Kubernetes Benchmark, kind=container): sus controles cosechados
#     caen en `acceso` (daemon/API/RBAC), `auditoria` (logging/audit) y `hardening` (config del
#     runtime/host) por las MISMAS reglas + `default_family` — NO requieren familias nuevas. Tras
#     sumar un benchmark de contenedor, revisar "asignados por default (REVISAR)" en gaps.md.
#   - CLOUD POSTURE (AWS/Azure/GCP/OCI) e IDENTIDAD CLOUD (Entra ID): son OTRO motor de Qualys
#     (TotalCloud/CloudView, CSPM), NO controles de la libreria PC -> NO se clasifican con estas
#     familias ni entran en este policy.xml. Estan en cis_catalog.yaml `additional_domains`
#     (pc_importable: false) para la matriz de cobertura; su pack es un flujo aparte (cloud).
families:
  - id: "acceso"
    number: 1
    heading: "1. Control de Acceso y Autenticacion"
    law_refs:
      - "Art. 14 quinquies b) — confidencialidad de los sistemas de tratamiento"
      - "Art. 14 bis — deber de secreto o confidencialidad"
      - "Art. 3 h) — principio de confidencialidad"
    match:
      categories: ["Access Control Requirements"]
      sub_categories: ["DB Access Controls"]

  - id: "cifrado"
    number: 2
    heading: "2. Cifrado (en reposo y en transito)"
    law_refs:
      - "Art. 14 quinquies a) — seudonimizacion y cifrado de datos personales"
    match:
      categories: ["Encryption"]
      sub_categories: ["DB Encryption"]

  - id: "auditoria"
    number: 3
    heading: "3. Registro, Auditoria y Trazabilidad"
    law_refs:
      - "Art. 14 quinquies d) — verificacion y evaluacion regulares de las medidas"
      - "Art. 14 quinquies (inc. final) — acreditar existencia y funcionamiento de las medidas"
      - "Art. 14 sexies — deber de reportar vulneraciones (sustrato de deteccion/registro)"
    match:
      categories: ["Integrity and Availability"]
      sub_categories: ["DB Auditing/Logging"]

  - id: "hardening"
    number: 4
    heading: "4. Configuracion Segura y Endurecimiento"
    law_refs:
      - "Art. 3 f) — principio de seguridad (proteger contra tratamiento no autorizado, perdida, filtracion, destruccion)"
      - "Art. 14 quater — proteccion desde el diseno y por defecto"
    match:
      # Los subs DB no mapeados a un pilar (incl. futuros de MySQL/MariaDB/MongoDB/Db2) NO se
      # listan aca: caen en `hardening` via `classification.default_family` (ver arriba). Como la
      # clasificacion es SUB-first, los subs DB de seguridad (DB Access Controls/DB Encryption/
      # DB Auditing/DB Backup) siguen ruteando a su pilar correcto. Los subs DB de hardening de
      # abajo quedan explicitos (defensivos: rutean aunque se cambie/quite el default_family).
      categories: ["OS Security Settings", "[Entire] Network Setting", "Anti-Virus/Malware",
                   "Services", "Web Application Services"]
      sub_categories: ["DB Specific Settings", "DB OS-dependent Controls", "DB Utilities and Tools",
                       "DBA Networking", "DB Installation/Patch Requirements"]

  - id: "disponibilidad"
    number: 5
    heading: "5. Disponibilidad y Recuperacion"
    law_refs:
      - "Art. 14 quinquies c) — capacidad de restaurar la disponibilidad y el acceso a los datos personales tras un incidente fisico o tecnico (backup/recuperacion)"
    match:
      # LIMITE de taxonomia: la plataforma no tiene un eje "disponibilidad" propio. Solo el sub DB
      # "DB Backup and Recovery" mapea limpio aca. El backup/DR a nivel OS suele caer bajo la CATEGORY
      # "Integrity and Availability" (-> familia auditoria) o "OS Security Settings" (-> hardening); por
      # eso esta familia es ESTRUCTURALMENTE delgada (cobertura parcial del Art. 14 quinquies c -> gaps.md).
      categories: []
      sub_categories: ["DB Backup and Recovery"]

# Obligaciones de la ley NO auditables por Qualys PC (van a gaps.md, para honestidad
# ante la Agencia / el cliente). No se "rellenan" con controles que no corresponden.
gaps:
  technical_partial:
    - ref: "Art. 14 quinquies c)"
      text: "Capacidad de restaurar la disponibilidad y el acceso a los datos tras un incidente (backup/DR). Cobertura PARCIAL: la familia 'Disponibilidad y Recuperacion' aporta controles de configuracion de backup a nivel de DB (DB Backup and Recovery), pero NO valida la existencia/restore real de backups, el DR de infraestructura ni los RTO/RPO -> complementar con proceso/otra herramienta."
    - ref: "Art. 14 quinquies a) (seudonimizacion)"
      text: "La seudonimizacion suele implementarse a nivel de aplicacion/datos, no de configuracion del host -> no auditable por PC."
  organizational:
    - "Art. 14 sexies — el PROCESO de notificacion de brechas a la Agencia y a los titulares (PC solo aporta el sustrato de deteccion)."
    - "Derechos del titular (acceso, rectificacion, supresion, oposicion, portabilidad) — Titulo I."
    - "Bases de licitud y consentimiento del tratamiento."
    - "Registro de actividades de tratamiento; encargado de prevencion / responsable; transferencias internacionales."
    - "Deber de informacion y transparencia (Art. 14 ter) salvo la publicacion de la propia politica de seguridad."
    - "Evaluacion de impacto y diferenciacion de estandares por tamano/tipo de dato (Art. 14 septies) — decision de negocio."
