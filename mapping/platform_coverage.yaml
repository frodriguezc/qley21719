# =============================================================================
# Mapping spec: Ley 21.719 (CL) -> capacidades de la plataforma Qualys (TODOS los
# módulos, no solo Policy Compliance). Fuente estructurada de LEY21719-PLATFORM-COVERAGE.md.
# -----------------------------------------------------------------------------
# Lo consume mapping/build_platform_matrix.py -> ley21719_platform_coverage_matrix.csv
# (una fila por par obligación×módulo). Posicionamiento técnico-comercial, NO contrato.
#
# DISCIPLINA ANTI-OVERREACH (regla de oro): Qualys AUDITA/VERIFICA configuración,
# DETECTA vulnerabilidades/exposición/compromiso, y PRODUCE EVIDENCIA. NO cifra, NO
# respalda, NO recupera datos, NO clasifica jurídicamente el dato, NO cuenta titulares.
# "auditar la config de X" != "hacer X"; "recolectar autodeclaración" != "verificar
# técnicamente"; "contener un endpoint" != "restaurar disponibilidad del dato".
#
# Tipos de cobertura:
#   full-in-domain    fit directo de la obligación DENTRO del dominio del módulo (no del artículo entero)
#   detection-substrate  provee el sustrato de detección/verificación, no el control en sí
#   evidence          produce la prueba auditable (acotada a lo que Qualys verifica)
#   partial           cubre una pata; el resto es organizacional/diseño/legal
#   out-of-scope      obligación organizacional/legal/business-decision sin pata técnica de seguridad
#   zero              familia de obligaciones SIN ninguna pata Qualys (no inferir cobertura)
#
# grounding (a nivel módulo): grounded (anclado a KB/docs) · mixed (módulo grounded pero
#   con features ASSUMPTION) · assumption (depende de feature/módulo sin cita firme).
#   Los claims a re-anclar están en `assumptions` (los resuelve la fase de re-grounding).
#
# Numeración de artículos verificada vs Sources/Ley-21719_13-DIC-2024.pdf (principios en Art. 3°).
# AMPLIAR/EDITAR = tocar este YAML y re-correr el builder; el CSV es derivado (no editar a mano).
# =============================================================================

meta:
  law: "Ley 21.719 (CL) — protección de datos personales"
  doc: "LEY21719-PLATFORM-COVERAGE.md"
  note: "Mapeo Ley -> capacidades de plataforma Qualys. Técnico-comercial, NO compromiso contractual."

# -----------------------------------------------------------------------------
# Módulos de la plataforma (columnas de la matriz). primary_role = su tipo de
# cobertura dominante frente a la ley (cada celda concreta puede variar).
# -----------------------------------------------------------------------------
modules:
  - key: pc_pa
    name: "Policy Compliance / Policy Audit"
    domain: "config compliance & hardening"
    primary_role: full-in-domain
    grounding: grounded
    note: "Audit Fix (PAF) y Control Criticality son add-ons opt-in, no vienen por defecto (ver assumptions)."
  - key: vmdr_pm
    name: "VMDR + Patch Management"
    domain: "vulnerabilidades + remediación"
    primary_role: full-in-domain
    grounding: grounded
    note: "TruRisk Isolate (anti-lateral); PM Mitigation reduce impacto sin desconectar."
  - key: was_tas
    name: "WAS / TotalAppSec"
    domain: "web & API"
    primary_role: full-in-domain
    grounding: grounded
    note: "Virtual patching depende de Qualys WAF (módulo aparte). 'Sensitive content' = detección por patrón, no DSPM."
  - key: cs
    name: "Container Security"
    domain: "imágenes / registry / runtime / K8s"
    primary_role: full-in-domain
    grounding: grounded
    note: "IaC posture vive en TotalCloud, NO en CS. Malware solo registry sensor; secrets solo filesystem de imagen."
  - key: cspm
    name: "TotalCloud / CloudView (CSPM)"
    domain: "cloud posture + IaC"
    primary_role: full-in-domain
    grounding: grounded
    note: "Incluye IaC Posture (pre-deploy) y CDR (Cloud Detection & Response, ex Blue Hexagon; runtime threat detection en TotalCloud, sin afirmar SKU/tier). Re-anclado jun-2026."
  - key: etm_id
    name: "ETM Identity"
    domain: "identidad (AD / Entra ID)"
    primary_role: full-in-domain
    grounding: grounded
    note: "Centrado en AD y Microsoft Entra ID; otros IdP no confirmados en KB."
  - key: saq
    name: "Security Assessment Questionnaire (SAQ)"
    domain: "assessment organizativo (autodeclarado)"
    primary_role: full-in-domain
    grounding: grounded
    note: "Recolecta autodeclaración (SIG/ISO/NIST/GDPR); NO verifica técnicamente por sí mismo."
  - key: fim_fam
    name: "FIM / FAM"
    domain: "integridad de archivos & acceso a dato"
    primary_role: detection-substrate
    grounding: grounded
    note: "FIM + FAM (File Access Monitoring) grounded: FAM documentado en FIM 4.0 (may-2024), incluido en la licencia FIM (mismo Cloud Agent), opt-in por regla. Re-anclado jun-2026."
  - key: csam
    name: "CyberSecurity Asset Management (CSAM)"
    domain: "superficie / inventario de activos"
    primary_role: detection-substrate
    grounding: grounded
    note: "CSAM + EASM grounded: EASM nativo en CSAM (CSAM 2.0/3.0), incluido en la suscripción CSAM (sin SKU aparte). Re-anclado jun-2026."
  - key: edr
    name: "EDR"
    domain: "endpoint / IoC / contención"
    primary_role: detection-substrate
    grounding: grounded
    note: "Quarantine 'limits network capabilities' = contención, NO restauración de disponibilidad del dato."
  - key: certview
    name: "Certificate View (CertView)"
    domain: "TLS/SSL en tránsito"
    primary_role: detection-substrate
    grounding: grounded
    note: "Detecta TLS débil/expirado en tránsito; no toca cifrado en reposo ni seudonimización."
  - key: trurisk
    name: "TruRisk / Reporting"
    domain: "cuantificación de riesgo + evidencia"
    primary_role: evidence
    grounding: grounded
    note: "Cuantifica riesgo (insumo de EIPD/14 quinquies); evidencia acotada a lo que Qualys verifica."

# -----------------------------------------------------------------------------
# Obligaciones técnicas de la ley (filas). `modules` = los que aportan una pata.
# Vacío = sin pata Qualys (out-of-scope / zero). El builder emite una fila por
# par (obligación × módulo), y una fila "—" para las obligaciones sin módulos.
# -----------------------------------------------------------------------------
obligations:
  - id: art_3_c_inc2
    article: "Art. 3° c) inc. 2"
    title: "Proporcionalidad / retención del dato"
    coverage_type: out-of-scope
    modules: [csam]
    scope_note: "Business-decision. Ciclo de vida del dato = plataforma del cliente. CSAM solo inventaría dónde viven los datos."
  - id: art_3_f
    article: "Art. 3° f)"
    title: "Principio de seguridad (paraguas)"
    coverage_type: detection-substrate
    modules: [vmdr_pm, pc_pa, was_tas, cs, cspm, fim_fam, edr, csam, certview, trurisk]
    scope_note: "Sustrato técnico del principio. Qualys detecta/verifica; NO implementa el control (cifrado/backup fuera)."
  - id: art_3_h
    article: "Art. 3° h)"
    title: "Confidencialidad"
    coverage_type: partial
    modules: [pc_pa, was_tas, cspm, etm_id, cs, fim_fam]
    scope_note: "Pata técnica (acceso/exposición) mapea; el deber de secreto de las personas es organizacional."
  - id: art_8_bis_final
    article: "Art. 8° bis inc. final"
    title: "Decisiones automatizadas / perfilado"
    coverage_type: out-of-scope
    modules: []
    scope_note: "Organizacional. Gobernanza de IA/explicabilidad. Sin fit Qualys."
  - id: art_14_bis
    article: "Art. 14 bis"
    title: "Deber de secreto / confidencialidad"
    coverage_type: detection-substrate
    modules: [etm_id, cspm, fim_fam, csam]
    scope_note: "Esencialmente NDA/políticas/governance. Qualys aporta detección de accesos indebidos a lo sumo."
  - id: art_14_ter_e
    article: "Art. 14 ter e)"
    title: "Mantener publicada la política y medidas adoptadas"
    coverage_type: evidence
    modules: [pc_pa, cspm, csam, fim_fam]
    scope_note: "Organizacional (transparencia). Qualys NUTRE el contenido; el acto de publicar es del responsable."
  - id: art_14_quater
    article: "Art. 14 quáter"
    title: "Protección desde el diseño y por defecto + minimización"
    coverage_type: partial
    modules: [pc_pa, csam, was_tas, cs, cspm]
    scope_note: "Pata técnica: hardening por defecto + reducción de superficie + IaC posture. Minimización a nivel de campo = sin pata (no DSPM)."
  - id: art_14_quinquies_final
    article: "Art. 14 quinquies (inc. final)"
    title: "Acreditar existencia Y funcionamiento de las medidas (carga de la prueba)"
    coverage_type: evidence
    modules: [vmdr_pm, pc_pa, was_tas, cs, cspm, fim_fam, edr, saq, trurisk]
    scope_note: "EL punto bisagra — acotado: evidencia de las medidas que Qualys MISMO verifica (config/vulns/postura), no de cifrado/backups/medidas organizativas."
  - id: art_14_quinquies_a
    article: "Art. 14 quinquies a)"
    title: "Seudonimización y cifrado de datos personales"
    coverage_type: detection-substrate
    modules: [pc_pa, cspm, was_tas, cs, certview]
    scope_note: "Business-decision. Qualys NO cifra/seudonimiza; a lo sumo DETECTA ausencia/debilidad vía checks de config."
  - id: art_14_quinquies_b
    article: "Art. 14 quinquies b)"
    title: "Garantizar CIA y resiliencia permanentes"
    coverage_type: detection-substrate
    modules: [vmdr_pm, pc_pa, was_tas, cs, cspm, etm_id, fim_fam, edr, csam, certview]
    scope_note: "Corazón del fit. Verifica/monitorea estado CIA; la garantía operativa/resiliencia (HA, backups) la dan otras capas."
  - id: art_14_quinquies_c
    article: "Art. 14 quinquies c)"
    title: "Restaurar disponibilidad y acceso tras incidente"
    coverage_type: out-of-scope
    modules: []
    scope_note: "Business-decision. Backup/DR/RTO-RPO. Qualys NO restaura; contención (EDR) != restauración del dato."
  - id: art_14_quinquies_d
    article: "Art. 14 quinquies d)"
    title: "Proceso de verificación/evaluación REGULAR de la eficacia"
    coverage_type: full-in-domain
    modules: [pc_pa, vmdr_pm, was_tas, cs, cspm, etm_id, saq, trurisk]
    scope_note: "El fit MÁS directo — pero per-dominio, no del artículo entero. Cada módulo ES el proceso de verificación de SU dominio. SAQ = assessment organizativo autodeclarado."
  - id: art_14_septies
    article: "Art. 14 septies"
    title: "Diferenciación de estándares (tipo de dato/tamaño/actividad/volumen)"
    coverage_type: partial
    modules: [pc_pa, vmdr_pm, csam, trurisk]
    scope_note: "Scoping regulatorio. Qualys HABILITA estándares diferenciados (criticidad/policies) pero NO gradúa por categoría de dato. El mínimo lo fija la Agencia."
  - id: art_14_sexies_1
    article: "Art. 14 sexies inc. 1"
    title: "Reportar a la Agencia las vulneraciones con riesgo razonable"
    coverage_type: detection-substrate
    modules: [vmdr_pm, fim_fam, edr, was_tas, cs, cspm, etm_id]
    scope_note: "Qualys DETECTA y fundamenta el evento; el ACTO de reportar a la Agencia es organizacional."
  - id: art_14_sexies_2
    article: "Art. 14 sexies inc. 2"
    title: "Registrar las brechas (naturaleza, categorías de dato, nº titulares, medidas)"
    coverage_type: partial
    modules: [vmdr_pm, pc_pa, was_tas, cs, cspm, etm_id, fim_fam, edr, csam]
    scope_note: "PARCIAL — el núcleo del registro queda fuera. Qualys aporta datos técnicos del evento; categorías de dato y nº de titulares = organizacional/jurídico (no clasifica ni cuenta)."
  - id: art_14_sexies_3
    article: "Art. 14 sexies inc. 3"
    title: "Notificar a los titulares en lenguaje claro"
    coverage_type: out-of-scope
    modules: [csam, fim_fam]
    scope_note: "Organizacional/legal. Qualys ayuda indirectamente a saber qué sistemas están en juego; NO clasifica ni notifica."
  - id: art_15_bis_5
    article: "Art. 15 bis inc. 5"
    title: "El encargado/procesador cumple 14 bis y 14 quinquies"
    coverage_type: partial
    modules: [saq, pc_pa, vmdr_pm, was_tas, cs, cspm, etm_id, fim_fam, edr, csam, certview, trurisk]
    scope_note: "PARCIAL. SAQ recolecta la autodeclaración del encargado (!= verificar técnicamente). Si hay acceso a su entorno, los demás módulos lo verifican. La extensión del deber es legal/contractual."
  - id: art_15_ter
    article: "Art. 15 ter"
    title: "EIPD / DPIA cuando hay alto riesgo"
    coverage_type: evidence
    modules: [trurisk, vmdr_pm, pc_pa, was_tas, cs, cspm, etm_id, saq]
    scope_note: "Organizacional/gobernanza. Qualys ALIMENTA la sección de riesgos técnicos; realizar la EIPD es del responsable."
  - id: art_16
    article: "Art. 16 / 16 bis / 16 ter"
    title: "Datos sensibles: garantías reforzadas"
    coverage_type: detection-substrate
    modules: [pc_pa, vmdr_pm, was_tas, cs, cspm, etm_id, fim_fam, edr, csam]
    scope_note: "El estándar reforzado eleva el nivel exigible sobre los sistemas que alojan datos sensibles. Qualys NO identifica jurídicamente qué dato es sensible (sin DSPM); protege los sistemas. Consentimiento = fuera."
  - id: art_16_quinquies_2
    article: "Art. 16 quinquies inc. 2"
    title: "Fines científicos/estadísticos: adoptar y ACREDITAR medidas"
    coverage_type: evidence
    modules: [vmdr_pm, trurisk, pc_pa, was_tas, cs, cspm, etm_id, fim_fam, edr, csam]
    scope_note: "Identificar riesgos + mitigar + acreditar mapea bien. La identificación de riesgos de RE-IDENTIFICACIÓN del dato es analítica de privacidad, fuera de Qualys."
  - id: art_16_sexies_2
    article: "Art. 16 sexies inc. 2"
    title: "Geolocalización: informar tipo/finalidad/duración/cesión"
    coverage_type: out-of-scope
    modules: []
    scope_note: "Organizacional (transparencia específica). Sin pata técnica de seguridad."
  - id: zero_consentimiento
    article: "Art. 16 y conexos"
    title: "Consentimiento y bases de licitud"
    coverage_type: zero
    modules: []
    scope_note: "CERO. Qualys no captura, gestiona ni evidencia consentimiento."
  - id: zero_arco
    article: "Derechos del titular (ARCO+)"
    title: "Acceso/rectificación/cancelación/oposición/portabilidad"
    coverage_type: zero
    modules: []
    scope_note: "CERO. Sin pata Qualys; proceso/aplicación del cliente."
  - id: zero_dspm
    article: "Clasificación jurídica del dato"
    title: "DSPM / Data Discovery de contenido / clasificación del dato"
    coverage_type: zero
    modules: []
    scope_note: "CERO sobre la clasificación del dato. Qualys NO tiene DSPM. Deja descubiertos: clasificación, minimización a nivel de campo, determinación de categorías/nº de titulares."

# -----------------------------------------------------------------------------
# Claims RE-ANCLADOS (verificación adversarial vs docs públicas de Qualys, jun-2026;
# workflow reground-ley21719-assumptions, 6/6 grounded, 0 desacuerdos del verificador).
# status: grounded (afirmable, con la redacción de `statement`) | pending | retracted.
# -----------------------------------------------------------------------------
assumptions:
  - key: csam_easm
    module: csam
    claim: "EASM / External Attack Surface Management de CSAM"
    status: grounded
    statement: "EASM es nativo de CSAM (CSAM 2.0, ago-2022; ampliado en 3.0, 2024); disponible con suscripción CSAM, NO es un SKU aparte. Vista outside-in de activos expuestos a Internet."
    sources:
      - "https://docs.qualys.com/en/csam/latest/inventory/sensors/easm.htm"
      - "https://www.qualys.com/company/newsroom/news-releases/usa/qualys-launches-external-attack-surface-management-easm"
  - key: fim_fam
    module: fim_fam
    claim: "FAM (File Access Monitoring) — acceso no autorizado a dato sensible en tiempo real"
    status: grounded
    statement: "Qualys FIM incluye FAM: alertas en tiempo real ante acceso no autorizado a archivos sensibles (who/what/when/where), aun sin modificación. FIM 4.0 (may-2024), incluido en la licencia FIM (mismo Cloud Agent), opt-in por regla. Pata más directa de 3° h)/14 bis/16."
    sources:
      - "https://docs.qualys.com/en/fim/latest/get_started/get_started_with_fim.htm"
      - "https://blog.qualys.com/product-tech/2024/04/10/real-time-file-access-monitoring-fam-with-qualys-fim"
  - key: totalcloud_cdr
    module: cspm
    claim: "TotalCloud CDR (Cloud Detection & Response)"
    status: grounded
    statement: "CDR es real: runtime threat detection (ex Blue Hexagon CTDR) integrado en TotalCloud (Deep Learning, multi-cloud). Describir como 'capacidad de TotalCloud (CNAPP runtime threat detection), tier según Qualys' — NO afirmar SKU/tier específico."
    sources:
      - "https://docs.qualys.com/en/cloudview/latest//cloud_detection_and_response/cloud_detection_and_response.htm"
      - "https://blog.qualys.com/product-tech/2023/02/09/announcing-general-availability-of-qualys-totalcloud"
  - key: sca_host
    module: vmdr_pm
    claim: "SCA / SBOM a nivel host (apps no containerizadas)"
    status: grounded
    statement: "Qualys SwCA (Software Composition Analysis) hace SCA + SBOM a nivel HOST vía Cloud Agent (Win/Linux; Ruby/Node/Go/Rust/PHP/Python/Java SE; SBOM CycloneDX 1.4/1.6 por UI y API). OJO: es OTRO motor (SwCA, activación propia, requiere VM), NO Policy Compliance -> pc_importable:false (plano additional_domains). Detecta inventario/vulns de OSS, no audita config CIS."
    sources:
      - "https://docs.qualys.com/en/ca/swca-user-guide/introduction/introduction.htm"
      - "https://docs.qualys.com/en/ca/swca-user-guide/swca_scan_settings_config/download_sbom.htm"
  - key: pc_paf_criticality
    module: pc_pa
    claim: "Audit Fix (PAF) + Control Criticality (5 niveles)"
    status: grounded
    statement: "CONFIRMADO opt-in (no default): Audit Fix/PAF es add-on con licencia propia (trial-then-purchase, requiere Cloud Agent + rol Manager/Unit Manager); Control Criticality (5 niveles) lo habilita Support/Account Manager para la suscripción. Confirmar ambos activos en el tenant antes de prometerlos."
    sources:
      - "https://docs.qualys.com/en/pa/latest/auto_remediation/creating_remediation_job.htm"
      - "https://docs.qualys.com/en/pa/latest/controls/control_criticality.htm"

# -----------------------------------------------------------------------------
# Superficie de API CSPM (CloudView / TotalCloud) — verificada vs CloudView API User
# Guide (jun-2026). READ-ONLY = solo GET; la consume qualys_client.CloudViewClient
# (gate allow-list-only). Mutaciones (connector run, report create) = POST/PUT/DELETE
# -> bloqueadas. ETM Identity es OTRA plataforma (JWT, POST-based) -> cliente aparte.
# -----------------------------------------------------------------------------
cspm_api:
  base_path: "/cloudview-api/rest/v1"
  auth: "HTTP Basic + X-Requested-With (igual que el cliente FO/QPS)"
  read_only_endpoints:
    controls_metadata: "GET /cloudview-api/rest/v1/controls/metadata/list"
    connectors: "GET /cloudview-api/rest/v1/{aws|azure|gcp}/connectors[/{connectorId}]  (v1; los connectors OCI viven solo en el namespace 3.0: qps/rest/3.0/.../ociassetdataconnector)"
    connector_groups: "GET /cloudview-api/rest/v1/groups[/{groupUuid}]"
    evaluations: "GET /cloudview-api/rest/v1/{aws|azure|gcp}/evaluations/{accountId|subscriptionId|projectId}"
    evaluations_oci: "GET /cloudview-api/rest/v1/oci/evaluations/?tenantId={id}  (confirmado verbatim vs guia tc/api: oci/get_oci_evaluation_list.htm)"
    evaluation_resources: "GET /cloudview-api/rest/v1/{provider}/evaluations/{account}/resources/{controlId}"
    evaluation_stats: "GET /cloudview-api/rest/v1/{aws|azure|gcp}/evaluations/stats/{controlId}/{connectorId}  (confirmado en Postman v1.23.0.0 AWS/Azure/GCP; OCI no lo expone)"
    report_list: "GET /cloudview-api/rest/v1/report/assessment/list?reportId=&status=  (poll asincrono)"
    report_download: "GET /cloudview-api/rest/v1/report/assessment/{reportId}/download?reportFormat=csv"
  # Superficie de REPORTES CSPM (VERIFICADO jun-2026 vs Postman v1.23.0.0 + guia tc/api). Crear/correr/
  # actualizar = MUTACION con human-gate -> el motor NO la dispara (solo documenta los curl en §3b del
  # apply-instructions). Aca queda como referencia de verbos/enums/modelo, no como superficie del cliente.
  report_surface:
    assessment_create: "POST /cloudview-api/rest/v1/report/assessment/create (Postman 'Create Assessment Report'). CONTRATO REAL verificado live contra OCI el 2026-08-12 — la guia tc/api NO documenta ni las obligatoriedades ni el case, cada punto se descubrio con un 400/500 del tenant: (1) `format` es CASE-SENSITIVE -> 'csv' en MINUSCULA ('CSV' da 400 'Parameter format has invalid value'); 'PDF' va en mayuscula y ademas exige UNA sola policy ('For pdf report only one policy required'). (2) `startDate` y `endDate` son OBLIGATORIOS y solo aceptan ISO-8601 con Z ('2026-08-01T00:00:00Z'); date pelado, epoch-ms y dd/mm/yyyy dan 400. (3) `query` es OBLIGATORIO pese a figurar como opcional: omitirlo da 500 con NPE (query.contains() sin null-check); '' es valido y no filtra; '*' da 400 'No Records returned'. (4) `connectorIds` deserializa como java.util.UUID -> hay que mandar el UUID del connector, NO el id numerico de Connector Mgmt 3.0 (400 'UUID has to be represented by standard 36-char representation'). (5) `reportName` solo admite alfanumerico, espacio y _-'() -> 422 con cualquier otro char; el PUNTO de 'Ley 21.719' lo rechazaba SIEMPRE. (6) La respuesta del create es el UUID PELADO, no un JSON. (7) report/assessment/list envuelve los items en `data`, no en el `content` de Spring."
    assessment_rerun:  "POST /cloudview-api/rest/v1/report/assessment/{reportId}/rerun"
    report_create:     "POST /cloudview-api/rest/v1/reports (la Postman v1.23.0.0 lo marcaba GET con body = error de autoria; guia tc/api: reports/create_report.htm). CONTRATO REAL verificado live contra OCI el 2026-08-12: (1) `executionType` va como QUERY PARAM (@RequestParam de Spring), NO en el body -> en el body da 400 'Required request parameter executionType for method parameter type ReportExecutionType is not present'; valor probado RUN_TIME ('ON_DEMAND' da 400 'Failed to convert executionType'). (2) `type` = MANDATE, no 'MANDATE_BASED' -> 422 con la lista de validos: known type ids = [CreateReportRequest, MANDATE, POLICY]. (3) El PDF va con UNA sola policy (misma restriccion que el assessment PDF). (4) Devuelve 201 (no 200) y, a diferencia del assessment, SI responde JSON con el reporte completo (title/type/format/accounts). (5) `title` sufre el mismo charset restringido que reportName. La DESCARGA del mandate sigue SIN API (/reports/* no expone download): el PDF se baja de la consola."
    report_update:     "PATCH /cloudview-api/rest/v1/reports/{reportId}  (guia tc/api: reports/update_report.htm; es PATCH, NO PUT)"
    report_delete:     "DELETE /cloudview-api/rest/v1/reports  (body = lista de reportIds)"
    cloud_type_enum:   "AWS · AZURE · GCP · OCI  (guia vigente create_report.htm; la coleccion v1.23.0.0 enumeraba solo AWS/Azure/GCP)"
    resource_results_enum: "PASS · PASSE (pass-with-exception, valor LEGITIMO — no es typo) · FAIL  (assessment_report.htm + controls/exceptions.htm)"
    async_model: "create -> reportId -> GET .../report/assessment/list?reportId= (estado Processing -> Completed, recien ahi descargable) -> download. Autoborra a los 7 dias de creado (assessment_report.htm)."
    mandate_bridge: "Ley 21.719 NO es mandate nativo (list_of_mandates.htm jun-2026: sin mandate chileno/LATAM) -> se puentea con ISO 27001 / NIST 800-53 / GDPR. GET /reports/mandates (lista) + GET /reports/policies?cloudType= + GET /reports/report_data/{reportId} (crosswalk control->requirement SOLO dentro de un mandate report ya generado; no hay catalogo CID->mandate standalone por API)."
    custom_policy_control_api: "NO hay endpoint de creacion de Custom Policy ni Custom Control en v1.23.0.0 ni en la guia vigente -> se crean en la UI (Policy > New) / por QFlow (§7 #2 RESUELTO = solo-UI)."
  blocked_mutations: "Reportes: assessment create + rerun = POST; report create = POST /reports, update = PATCH /reports/{id}, delete = DELETE /reports. Connectors: create/run/enable/disable/delete. Custom policy/control: sin endpoint de creacion (solo UI/QFlow). Todo eso lo corre el cliente con human-gate; el cliente CSPM no expone ningun verbo de escritura."
  verified_live: "Smoke US03, jun-2026: host CSPM = qualysguard.qg3 (el FO qualysapi.qg3 da 404, gateway.qg3 da 401). controls/metadata/list, {provider}/connectors y {provider}/evaluations/{account} -> HTTP 200. Shapes: controls bajo clave 'control' (controlName/serviceType/policyNames); connectors+evaluations con paginación Spring bajo 'content'; evaluations trae controlId/controlName/service/result(PASS/FAIL)/policyNames (autosuficiente por cuenta). E2E real: 168 controles AWS evaluados, clasificados, 116 FAIL."
  verified_live_2: "scripts/verify_tenant.py, 2026-06-25, US03/qg3, credencial MANAGER: controls/metadata/list + aws/evaluations (687245677417) + gcp/evaluations (qualyswd) -> HTTP 200 con CIDs/control.name reales (AWS: MFA/credenciales-45d/rotación-keys-90d/password-policy; GCP 52000-52004). El tenant tiene connectors AWS + GCP SOLAMENTE (sin Azure ni OCI) -> OCI live no ejercitable acá (no hay connector, no es la API). report/assessment/list SIN filtro hace ReadTimeout en qg3 (endpoint pesado/lento, NO permiso ni shape; el flujo real del cliente poll-ea por reportId filtrado)."
  caveats:
    - "Host CSPM = qualysguard.<seg> (RESUELTO live US03 -> qg3). El cliente deriva qualysapi.<seg> -> qualysguard.<seg> por defecto (tabla PODS en qualys_client/client.py); override con server=. El patron portal qualysguard.<seg> es el esperado en los demas PODs; confirmar al desplegar en otro POD."
    - "evaluations/{account}/resources/{controlId} CONFIRMADO live (AWS+GCP, 200, paginado bajo content con resourceId/region/evidences). El subpath /stats/{controlId}/{connectorId} (§7 #A5) esta CONFIRMADO en Postman v1.23.0.0 para AWS/Azure/GCP (no ejercitado live); OCI no lo expone. OCI TAMPOCO expone /resources: VERIFICADO live 2026-08-12, GET /oci/evaluations/<tenancy>/resources/40003 -> HTTP 404 'No static resource' (OCI usa query param ?tenantId= en vez de account en el path, y el detalle por recurso no esta en esa forma). CONSECUENCIA de producto: en OCI el pack entrega el control que falla pero NO el recurso concreto (que bucket/VCN/usuario); esa identificacion sale de la consola OCI, del oci CLI, o del REPORTE de assessment (create_report con resourceSummaryInclude:true + resourceResults:[FAIL], que es POST -> human-gate del cliente; ver apply-instructions.md). En AWS/GCP si se puede bajar al recurso por API read-only."
    - "Connector API v3 (centralizado) en migración; para LISTAR (read-only) los GET v1 bastan. Los connectors OCI estan SOLO en 3.0 (qps/rest/3.0/.../ociassetdataconnector); la entrada /oci/connectors de la allow-list es defensiva (read-only) y puede dar 404 (las OCI evaluations si estan en v1)."
    - "§7 #8 ROL (RESUELTO a nivel doc, Reporting_Permission.htm): un sub-user con rol READER ve reporting controls/connectors y puede LEER reportes; CREAR/editar/borrar reportes requiere que un Manager le asigne la Reporting Permission (rol pre-definido '- only Reports'). El cliente CSPM solo emite GETs (list controls/evaluations/report list+download) -> un Reader basta para la herramienta; el `create`/`rerun` (POST, §3b) es human-gate y necesita Reporting Permission. Verify live 2026-06-25 con MANAGER: los GETs read-only (controls/metadata + AWS/GCP evaluations) dan 200. El run Reader-scoped sigue PENDIENTE: aún NO hay un API user Reader provisionado en el tenant para probarlo (lo cierra `scripts/verify_tenant.py --user <reader>` cuando exista). Recomendar credencial de minimo privilegio."
    - "§7 #5 OCI (RESUELTO + EJERCITADO LIVE desde 2026-06-27): ausente de la coleccion v1.23.0.0 pineada; PRESENTE en la guia tc/api vigente (connectors 3.0 + evaluations v1 /oci/evaluations/?tenantId= + cloudType OCI en reportes). El verify_tenant.py del 2026-06-25 corrio contra un tenant con connectors AWS+GCP solamente -> de ahi el 'OCI no ejercitado', que quedo OBSOLETO dos dias despues y no se actualizo hasta ago-2026. CERRADO LIVE el 2026-06-27 en un tenant US03/qg3 CON OCI onboardeado, corrida read-only de cloud_posture_pack.py (8 GETs): discovery por connectors/v1.0/OCI/list -> tenancy descubierta, y /oci/evaluations/?tenantId=<ocid> -> HTTP 200 con 78/78 controles evaluados y clasificados (envelope Spring bajo content, igual que AWS). RE-CONFIRMADO el 2026-08-12 (7 GETs): 82/82 controles -- la libreria CIS OCI sumo 4 CIDs (40047/40102/40103/40104) entre ambas fechas, sin perder ninguno. CERRADO POR COMPLETO el 2026-08-12: los REPORTES OCI tambien se ejercieron live (autorizacion explicita del dueno del tenant, credencial Manager). Assessment Report end-to-end: create -> HTTP 200 + reportId, poll ACCEPTED -> COMPLETED en ~30s, download CSV de 3.7 MB con 5780 filas y detalle POR RECURSO. Eso da lo que la API read-only de OCI no expone: identifico el unico bucket publico del CID 40003 (region sa-santiago-1, visibilidad ObjectRead). El ejercicio destapo 7 desviaciones del contrato documentado -> ver cspm_api.report_surface.assessment_create. El MANDATE Report OCI tambien se ejercio live el mismo dia: POST /reports?executionType=RUN_TIME -> 201 con el reporte en JSON (mandate afin ISO/IEC 27001:2022, mandateId 9561), y destapo 3 desviaciones mas (executionType como query param, type=MANDATE y no MANDATE_BASED, PDF con una sola policy) -> ver cspm_api.report_surface.report_create. Su DESCARGA sigue sin API (consola). Residual restante del §7: solo el run Reader-scoped de #8."
    - "§7 #4 VERSION (RESUELTO): el repo pinea la Postman 'CV 1.23.0.0' (2022). La fuente vigente es la guia online TotalCloud API (docs.qualys.com/en/tc/api/), que evoluciono (rebrand TotalCloud, OCI agregado, update = PATCH). Tratar tc/api como fuente de verdad al desplegar; los paths v1 core (controls/connectors/evaluations) siguen estables."
