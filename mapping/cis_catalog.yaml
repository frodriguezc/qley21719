  - key: amazon_linux
    group: "Server OS · Linux (Amazon)"
    kind: os
    benchmark: "CIS Amazon Linux Benchmark (2 / 2023, según la flota)"
    benchmark_versioned: "CIS Amazon Linux {ver} Benchmark"
