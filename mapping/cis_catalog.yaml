# =============================================================================
# Catálogo curado: tecnología -> benchmark CIS de librería Qualys (+ patrones de match)
# -----------------------------------------------------------------------------
# Lo consume scripts/tenant_coverage_pack.py. Es el PUENTE que la API NO da: el
# catálogo "Import from Library" no es API-enumerable, así que el mapeo
# tecnología -> benchmark recomendado vive curado acá (sembrado de la matriz de
# cobertura de la Ley 21.719 + el doc de librería Qualys, mayo 2026).
#
# Cada entrada (`target`):
#   key:           id interno único
#   group:         agrupador para el reporte
#   kind:          os | db | middleware | container | virtualization | network
#                  (os = detectable por el SO del host; el resto = best-effort -> "verificar")
#   benchmark:     nombre del benchmark CIS a importar (Import from Library)
#   pillars:       familias de la ley a las que aporta (informativo)
#   os_match:      regex (case-insensitive) contra el <OS> del host  -> presencia en la flota
#   software_match:regex contra software/servicios detectados (best-effort; db/middleware/...)
#   title_match:   regex contra el TITLE de las policies importadas  -> "ya está en el tenant"
#
# Notas:
#  - os_match define "lo que la flota NECESITA"; title_match define "lo que el tenant YA tiene".
#  - FALTANTE = target presente en la flota (os/software) cuyo benchmark NO está importado.
#  - kind != os y sin software_match positivo -> se reporta como "verificar manualmente".
#  - Las versiones CIS reales pueden ir por detrás del SO (p.ej. macOS) -> match exacto de tech.
# =============================================================================

targets:
  # ---------------- Endpoints Windows ----------------
  - key: win10
    group: "Endpoints · Windows"
    kind: os
    benchmark: "CIS Microsoft Windows 10 Enterprise Benchmark"
    pillars: [acceso, cifrado, auditoria, hardening]
    os_match: ['windows\s*10\b', 'windows.*\b10 (enterprise|pro)']
    title_match: ['windows 10']
  - key: win11
    group: "Endpoints · Windows"
    kind: os
    benchmark: "CIS Microsoft Windows 11 Enterprise Benchmark"
