    title_match: ['esxi', 'vmware']

  # ---------------- Red / seguridad ----------------
  - key: cisco_ios
    group: "Red / seguridad"
    kind: network
    benchmark: "CIS Cisco IOS Benchmark (o DISA Cisco IOS STIG)"
    pillars: [acceso, cifrado, auditoria, hardening]
    os_match: ['cisco ios', 'cisco.*ios']
    software_match: ['cisco ios']
    title_match: ['cisco ios']
  - key: palo_alto
    group: "Red / seguridad"
    kind: network
    benchmark: "CIS Palo Alto Firewall Benchmark"
    pillars: [acceso, cifrado, auditoria, hardening]
    os_match: ['pan-os', 'palo alto']
    software_match: ['pan-os', 'palo alto']
    title_match: ['palo alto']

# =============================================================================
# Dominios adicionales (más allá de los `targets` PC autodetectados por la flota):
# cobertura de CLOUD POSTURE e IDENTIDAD, para tener la matriz COMPLETA de la ley.
# -----------------------------------------------------------------------------
# OJO: la mayoría NO son benchmarks de la librería de Policy Compliance ni entran en
# el `policy.xml` de PC — se evalúan con OTRO motor de Qualys (TotalCloud / CloudView,
# CSPM). Por eso viven acá y NO en `targets` (que los meterían en el harvest PC y
# romperían). Cada entrada declara su `control_system` y `pc_importable`.
#   - tenant_coverage_pack.py NO los cosecha en el `policy.xml` (solo cosecha `targets`); sí los
#     lista informativamente en `faltantes.txt` bajo "Fuera del alcance de Policy Compliance".
#   - build_coverage_matrix.py los incluye en la matriz de cobertura (CSV).
# Campos: key · group · kind (cloud|identity) · qualys_app · control_system
#   (cloud-posture|pc-library) · pc_importable (true|false) · benchmark · cis_version
#   (última conocida) · pillars (familias de la ley) · status (active|planned) · notes.
# AMPLIAR cobertura cloud/identidad/SaaS = sumar entradas acá + re-correr el builder.
# Excepción: Active Directory SÍ es PC (no tiene benchmark standalone; sus controles de
#   Domain Controller viven en el CIS Windows Server, ya cubierto por los `win_server_*`).
#
# `cis_version`: última versión publicada por CIS conocida al 2026-06 (verificada contra
#   cisecurity.org). CIS itera ~anual → VERIFICAR la versión vigente en CIS WorkBench y la
#   que soporte el motor (TotalCloud/CSPM) al momento de desplegar; el número de abajo es
#   referencia, no contrato.
# =============================================================================
additional_domains:
  - key: cloud_aws
    group: "Cloud · AWS"
    kind: cloud
    qualys_app: "TotalCloud / CloudView (CSPM)"
    control_system: cloud-posture
    pc_importable: false
    benchmark: "CIS Amazon Web Services Foundations Benchmark"
    cis_version: "v5.0.0 (base ampliamente adoptada; v7.0.0 = última publicada 2026)"
    pillars: [acceso, cifrado, auditoria, hardening, disponibilidad]
    status: planned
    notes: "Cloud posture (CSPM): IAM/MFA (acceso), KMS/cifrado en reposo+tránsito (cifrado), CloudTrail/Config (auditoria), endurecimiento de servicios (hardening), backups/multi-AZ (disponibilidad). NO es librería PC."
  - key: cloud_azure
    group: "Cloud · Azure"
    kind: cloud
    qualys_app: "TotalCloud / CloudView (CSPM)"
    control_system: cloud-posture
    pc_importable: false
    benchmark: "CIS Microsoft Azure Foundations Benchmark"
    cis_version: "v6.0.0 (2026)"
    pillars: [acceso, cifrado, auditoria, hardening, disponibilidad]
    status: planned
    notes: "Cloud posture (CSPM). RBAC/PIM, Key Vault, Monitor/Activity Log, Defender. NO es librería PC."
  - key: cloud_gcp
    group: "Cloud · GCP"
    kind: cloud
    qualys_app: "TotalCloud / CloudView (CSPM)"
    control_system: cloud-posture
    pc_importable: false
    benchmark: "CIS Google Cloud Platform Foundation Benchmark"
    cis_version: "v5.0.0 (2026-05; v4.0.0 = 2025)"
    pillars: [acceso, cifrado, auditoria, hardening, disponibilidad]
    status: planned
    notes: "Cloud posture (CSPM). IAM, Cloud KMS, Cloud Audit Logs. NO es librería PC."
  - key: cloud_oci
    group: "Cloud · OCI"
    kind: cloud
    qualys_app: "TotalCloud / CloudView (CSPM)"
    control_system: cloud-posture
    pc_importable: false
    benchmark: "CIS Oracle Cloud Infrastructure Foundations Benchmark"
    cis_version: "v3.1.0 (2026-03; v3.0.0 = 2025-02)"
    pillars: [acceso, cifrado, auditoria, hardening, disponibilidad]
    status: planned
    notes: "Cloud posture (CSPM). NO es librería PC."
  - key: identity_entra
    group: "Identidad · Entra ID / M365"
    kind: identity
    qualys_app: "TotalCloud / CloudView (CSPM)"
    control_system: cloud-posture
    pc_importable: false
    benchmark: "CIS Microsoft 365 Foundations Benchmark (incl. sección Entra ID / Azure AD)"
    cis_version: "v7.0.0 (2026-06; sección 5 = Entra ID); v6.0.1 = 2026-02 (sigue como versión de automated assessment en CIS-CAT Pro)"
    pillars: [acceso, auditoria, hardening]
    status: planned
    notes: "Identidad cloud: MFA, acceso condicional, roles privilegiados, sign-in logs. Cloud posture (CSPM), NO PC."
  - key: identity_ad
    group: "Identidad · Active Directory"
    kind: identity
    qualys_app: "Policy Compliance"
    control_system: pc-library
    pc_importable: true
    benchmark: "CIS Microsoft Windows Server Benchmark (perfil Domain Controller)"
    cis_version: "(la del CIS Windows Server de la flota; resuelta por win_server_*)"
    pillars: [acceso, auditoria, hardening]
    status: active
    notes: "AD no tiene benchmark standalone: los controles de Domain Controller viven en el CIS Windows Server (perfil DC), YA cubierto por los targets win_server_*. SÍ PC-importable; acá solo para visibilidad en la matriz."
