  # ---------------- Virtualización ----------------
  - key: esxi
    group: "Virtualización"
    kind: virtualization
    benchmark: "CIS VMware ESXi Benchmark (versión = la de la flota)"
    benchmark_versioned: "CIS VMware ESXi {ver} Benchmark"
    version_re: 'esxi\s+(\d+)'
    pillars: [acceso, cifrado, auditoria, hardening]
